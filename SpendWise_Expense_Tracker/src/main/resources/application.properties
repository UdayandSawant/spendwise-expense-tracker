spring.application.name=spendwise
server.port=8080

# Default: H2 file database, no installation needed (data is saved in the ./data folder).
# To use MySQL instead, set DB_URL, DB_USER and DB_PASSWORD (see README).
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/spendwise}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Handy for viewing the database in the browser: http://localhost:8080/h2-console
spring.h2.console.enabled=true
